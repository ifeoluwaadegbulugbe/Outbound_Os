<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Outbound OS Assistant — Options</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 520px; margin: 40px auto; color: #1c1917; padding: 0 16px; }
    label { display: block; margin-top: 14px; font-weight: 600; font-size: 13px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #d6d3cf; border-radius: 8px; margin-top: 4px; font: inherit; }
    button { margin-top: 16px; padding: 8px 14px; border-radius: 8px; border: 0; background: #e2496f; color: #fff; font-weight: 600; cursor: pointer; }
    #out { margin-top: 12px; font-size: 13px; }
  </style>
</head>
<body>
  <h1 style="font-size:18px">Outbound OS Assistant</h1>
  <p>Connect the extension to your Outbound OS app. Create a token in the app under <b>Integrations → Browser extension</b>.</p>
  <label>App URL<input id="appUrl" placeholder="http://localhost:3100" /></label>
  <label>Extension token<input id="token" type="password" placeholder="obx_…" /></label>
  <button id="save">Save & test</button>
  <div id="out"></div>
  <script src="options.js"></script>
</body>
</html>
